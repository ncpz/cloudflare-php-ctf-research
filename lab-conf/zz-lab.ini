; Lab-only overrides on top of the stock php:8.5.11-apache defaults.
; V8 fix: cleanup=0 (the V6 accumulation-oracle override) silently disabled the
; END-cleanup path that the 52704 A1 stage depends on. The CTF target runs
; cleanup=1 (the compiled default); this lab must match it.
; session.upload_progress.cleanup = 0
; V18e: the V18c file-logging "fix" (error_log->/var/log/apache2/php_errors.log)
; BROKE the arming geometry — fopen()ing the log file inside the OOM fatal path
; changes the allocation sequence in the razor zone; every A1 config went dead
; (the "era-lock" was an artifact).  Reverted to /dev/stderr.  The pipe-wedge
; risk is managed by keeping a `docker logs -f` drainer running instead.
log_errors = On
error_log = /dev/stderr
